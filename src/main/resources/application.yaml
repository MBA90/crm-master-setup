spring:
  application:
    name: crm-master-setup

  datasource:
    url: jdbc:postgresql://localhost:5432/crm
    username: crm_master_setup
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      auto-commit: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: crm_master_setup

  liquibase:
    change-log: classpath:db/changelog/master.xml
    default-schema: crm_master_setup

  data:
    redis:
      host: localhost
      port: 6379
      password: admin
      timeout: 2s
      connect-timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: 24h
      key-prefix: "crm-master-setup:"
      use-key-prefix: true
      cache-null-values: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/crm-realm

server:
  port: 8501

logging:
  level:
    org.hibernate.orm.connections.pooling: warn